# Configurações Gerais
spring.application.name=JPA

  # Profiles (comentado conforme original)
  # spring.profiles.active=producao

spring.output.ansi.enabled=ALWAYS
spring.threads.virtual.enabled=true

  # Datasource
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/library}
spring.datasource.username=${DATASOURCE_USER:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

  # JPA / Hibernate
#spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true

  # Security / OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

  # Logging
logging.pattern.console=%clr(%d{dd-MM-yyyy HH:mm:ss}){faint} %clr(%5p) %clr([%t]){faint} %clr(%-40.40logger){cyan} %clr(:){yellow} %m%n
logging.file.name=app.log
logging.level.root=info
logging.level.com.luccasaps.jpa=info
logging.level.org.springframework.web=info
logging.level.org.springframework.security=info

  # SpringDoc
springdoc.override-with-generic-response=false

  # Actuator / Management
management.server.port=9090
management.endpoints.web.exposure.include=*


# Profile: Produção
#---
#spring.config.activate.on-profile=producao
#spring.jpa.show-sql=false

# Profile: Teste
#---
spring.config.activate.on-profile=teste
spring.jpa.show-sql=true